<h1>Buscar produtos</h1>

<form [formGroup]="form" (ngSubmit)="buscar()" class="linha">
  <div>
    <label for="nome">Nome</label>
    <input id="nome" formControlName="nome" />
  </div>
  <div>
    <label for="cor">Cor</label>
    <input id="cor" formControlName="cor" />
  </div>
  <button type="submit">Buscar</button>
</form>

@if (produtos().length > 0) {
  <table>
    <thead>
      <tr><th>ID</th><th>Nome</th><th>Cor</th><th>Preço</th><th>Categoria</th><th>Ações</th></tr>
    </thead>
    <tbody>
      @for (p of produtos(); track p.id) {
        <tr>
          <td>{{ p.id }}</td>
          <td>{{ p.nome }}</td>
          <td>{{ p.cor }}</td>
          <td>{{ p.preco | currency: 'BRL' }}</td>
          <td>{{ p.categoriaNome }}</td>
          <td><a class="botao secundario" [routerLink]="['/produtos', p.id]">Detalhes</a></td>
        </tr>
      }
    </tbody>
  </table>
} @else if (consultou()) {
  <p class="vazio">Nenhum produto encontrado.</p>
}
