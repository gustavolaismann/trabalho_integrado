<h1>Detalhes do produto</h1>

@if (produto(); as p) {
  <table>
    <tr><th>ID</th><td>{{ p.id }}</td></tr>
    <tr><th>Nome</th><td>{{ p.nome }}</td></tr>
    <tr><th>Cor</th><td>{{ p.cor }}</td></tr>
    <tr><th>Preço</th><td>{{ p.preco | currency: 'BRL' }}</td></tr>
    <tr><th>Categoria</th><td>{{ p.categoriaNome }}</td></tr>
  </table>

  <p class="acoes">
    <a class="botao secundario" routerLink="/produtos">Voltar</a>
    @if (auth.ehAdmin()) {
      <a class="botao" [routerLink]="['/produtos', p.id, 'editar']">Editar</a>
      <button type="button" class="perigo" (click)="excluir(p)">Excluir</button>
    }
  </p>
}
